<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zPlayer Badge Library</title>
  <style>
    :root { color-scheme: dark; --bg:#111315; --panel:#191c20; --line:#2c3137; --muted:#9aa3ad; --accent:#6ea8ff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: #f2f5f8; font: 14px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; }
    header { position: sticky; top: 0; z-index: 2; padding: 18px 24px 14px; background: rgba(17,19,21,.94); border-bottom: 1px solid var(--line); backdrop-filter: blur(10px); }
    h1 { margin: 0 0 4px; font-size: 20px; }
    .sub { color: var(--muted); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
    input { width: min(360px, 100%); padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: #0d0f11; color: inherit; outline: none; }
    input:focus { border-color: var(--accent); }
    .pill, button { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: #242a31; color: #cbd5df; font-size: 12px; }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); color: #fff; }
    main { padding: 8px 24px 48px; }
    section { margin-top: 26px; }
    h2 { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; font-size: 16px; }
    h2 small { color: var(--muted); font-weight: 400; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
    .card { min-width: 0; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
    .preview { display: flex; align-items: center; justify-content: center; height: 64px; margin-bottom: 10px; padding: 8px; border-radius: 8px; background: #101214; overflow: hidden; }
    .preview img { max-width: 100%; max-height: 48px; object-fit: contain; }
    .fallback { display: none; min-width: 64px; padding: 6px 12px; border: 1px solid #46515c; border-radius: 6px; color: #fff; background: #2b3138; font-weight: 600; text-align: center; }
    .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; color: var(--muted); font-size: 11px; }
    .meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .host { color: #8bb4f8; }
    .empty { color: var(--muted); padding: 20px 0; }
    footer { margin-top: 36px; padding: 18px 24px 36px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    footer a { color: #8bb4f8; }
  </style>
</head>
<body>
<header>
  <h1>zPlayer Badge Library</h1>
  <div class="sub">技术标签、封装格式、字幕组与制作组 · 共 <strong id="count">-</strong> 枚</div>
  <div class="toolbar">
    <input id="search" type="search" placeholder="搜索名称、ID 或正则…" autofocus>
    <span class="pill" id="visible-count">加载中…</span>
    <button id="copy-url" type="button">复制徽章库地址</button>
    <a class="pill" href="badges.json" target="_blank" rel="noreferrer">查看 JSON</a>
  </div>
</header>
<main id="root"><div class="empty">正在加载 badges.json…</div></main>
<footer>
  图片和规则来自 zPlayer Badge Library 及其上游作者。使用或再分发前请阅读
  <a href="THIRD_PARTY_NOTICES.md">第三方声明</a>。
  通过 GitHub Pages 打开此页面时，页面地址就是徽章库的预览地址。
</footer>
<script>
  const root = document.getElementById('root');
  const search = document.getElementById('search');
  const visibleCount = document.getElementById('visible-count');
  const count = document.getElementById('count');
  let data;

  const escapeText = (value) => String(value ?? '');

  function render() {
    const q = search.value.trim().toLowerCase();
    const matched = data.filters.filter((f) =>
      [f.name, f.id, f.groupId, f.pattern].join(' ').toLowerCase().includes(q));
    root.replaceChildren();
    for (const group of data.groups) {
      const items = matched.filter((filter) => filter.groupId === group.id);
      if (!items.length) continue;
      const section = document.createElement('section');
      const title = document.createElement('h2');
      title.textContent = group.name;
      const groupCount = document.createElement('small');
      groupCount.textContent = items.length + ' 枚';
      title.append(groupCount);
      const grid = document.createElement('div');
      grid.className = 'grid';
      for (const item of items) {
        const card = document.createElement('article');
        card.className = 'card';
        const preview = document.createElement('div');
        preview.className = 'preview';
        if (item.imageURL) {
          const image = document.createElement('img');
          image.loading = 'lazy';
          image.alt = escapeText(item.name || item.id);
          image.src = item.imageURL;
          const fallback = document.createElement('span');
          fallback.className = 'fallback';
          fallback.textContent = escapeText(item.name || item.id);
          image.onerror = () => { image.remove(); fallback.style.display = 'block'; };
          preview.append(image, fallback);
        } else {
          const fallback = document.createElement('span');
          fallback.className = 'fallback';
          fallback.textContent = escapeText(item.name || item.id);
          fallback.style.display = 'block';
          preview.append(fallback);
        }
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = escapeText(item.name || item.id);
        name.title = name.textContent;
        const meta = document.createElement('div');
        meta.className = 'meta';
        const id = document.createElement('span');
        id.textContent = escapeText(item.id);
        const kind = document.createElement('span');
        kind.className = 'host';
        kind.textContent = item.imageURL?.includes('/generated/') ? 'generated' : 'original';
        meta.append(id, kind);
        card.append(preview, name, meta);
        grid.append(card);
      }
      section.append(title, grid);
      root.append(section);
    }
    if (!matched.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '没有匹配的徽章';
      root.append(empty);
    }
    visibleCount.textContent = '显示 ' + matched.length + ' 枚';
  }

  document.getElementById('copy-url').addEventListener('click', async () => {
    const url = new URL('badges.json', location.href).href;
    try {
      await navigator.clipboard.writeText(url);
      visibleCount.textContent = '已复制导入地址';
    } catch {
      window.prompt('复制徽章库地址', url);
    }
  });

  search.addEventListener('input', render);
  fetch('./badges.json', { cache: 'no-cache' })
    .then((response) => {
      if (!response.ok) throw new Error('HTTP ' + response.status);
      return response.json();
    })
    .then((json) => {
      data = json;
      count.textContent = data.filters.length;
      render();
    })
    .catch((error) => {
      root.innerHTML = '<div class="empty">加载失败：' + escapeText(error.message) +
        '<br>请通过 GitHub Pages 或本地 HTTP 服务打开此页面。</div>';
    });
</script>
</body>
</html>
